spring:
  application:
    name: game-state-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: game-state-service
      auto-offset-reset: earliest   # a new consumer group starts from the beginning of the topic
  data:
    redis:
      host: localhost
      port: 6379
  docker:
    compose:
      file: ../compose.yaml
      lifecycle-management: start-only

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
